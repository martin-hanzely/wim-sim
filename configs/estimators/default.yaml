# Reference edge pipeline: peak feature, static affine baseline.
#
# Thresholds are in sensor units above the estimated zero line, so they do not need retuning when
# the baseline drifts. At k0 = 2e-4 mV/V per kg, 0.05 mV/V is a 250 kg axle -- comfortably below the
# lightest car axle in the shipped fleet (~620 kg) and comfortably above the noise floor
# (2e-4 mV/V, i.e. 1 kg).

name: default
description: Peak feature, static affine baseline. The floor every other configuration must beat.

preprocess:
  despike: false
  filter: none
  compensate_group_delay: true
  zero_window_s: 2.0
  zero_update_s: 0.25

detect:
  start_threshold: 0.05     # ~250 kg
  end_threshold: 0.02       # ~100 kg
  end_hold_s: 0.002
  min_duration_s: 0.001
  max_duration_s: 2.0
  refractory_s: 0.0         # axles within a bogie are milliseconds apart; never suppress them
  merge_gap_s: 0.6
  subsample_peak: true
  area_pad_widths: 1.0

estimate:
  feature: peak
  axle_summation: whole_signal
  estimator: static_affine
  coverage_target: 0.95
  bootstrap_passes: 50

uncertainty:
  # analytic is the estimator's own band; conformal reads the quantile off the residuals actually
  # seen and assumes nothing about their shape. The experiment sweeps this.
  method: conformal          # kalman + analytic measured 0.0065 coverage; see core/config.py
  conformal_score: relative
  max_calibration: 500

drift:
  detectors: [cusum, page_hinkley]
  warmup: 60                 # in *references*, so readiness costs warmup * reference_every_n passes
  cusum_threshold: 12.0
  cusum_slack: 0.5           # nothing at or below this is ever detected -- the loop's hard floor
  # 7.5, not the 15.0 this shipped with. Selected from `configs/experiments/detector_thresholds.yaml`
  # (340 runs, seventeen arms, ten seeds): at 15.0 Page-Hinkley caught 1 of 20 injected faults on
  # S4, at 7.5 it caught 5 of 20, and BOTH at 0.062 false alarms per hour. The old value was
  # mistuned at equal false-alarm cost, so this is free recall rather than a trade.
  #
  # Not lower. The same sweep shows recall falling again past this point -- 0.25 at 7.5 and at 3.75,
  # back to 0.05 at 1.875 -- because an alarm holds the controller in DRIFT_SUSPECTED for
  # `confirmation_passes` residuals and a spurious alarm eats the window a real fault must be caught
  # in. 7.5 is the shallow end of the plateau, which is where a threshold belongs.
  page_hinkley_threshold: 7.5
  page_hinkley_tolerance: 0.5
  adwin_delta: 0.002
  ks_window: 60
  ks_alpha: 0.0001

control:
  # Off by default so phase 2's and phase 4's numbers stay comparable.
  enabled: false
  confirmation_passes: 60    # the confirmable floor is 3 * 1.2533 / sqrt(this) residual sigmas
  confirm_sigma: 3.0
  # null = no cap, which is what every sweep before the Stage D revision ran with.
  # Written out so an override can reach it. Stage D sets it from the fault horizon.
  confirmation_max_s: null
  min_reference_observations: 10
  cooldown_s: 3600.0
  verification_passes: 50
  max_references: 200
  # Written out rather than left to the model default because an override refuses a key
  # that does not already exist, and Stage C1 switches this per arm.
  blocking: true            # report a drift alarm only from MONITORING
  arbitration: local
  reference_mode: supervised
  reference_every_n: 20      # the supply rate of known masses; the most important swept factor
