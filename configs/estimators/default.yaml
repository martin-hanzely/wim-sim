# Reference edge pipeline: peak feature, static affine baseline.
#
# Thresholds are in sensor units above the estimated zero line, so they do not need retuning when
# the baseline drifts. At k0 = 2e-4 mV/V per kg, 0.05 mV/V is a 250 kg axle -- comfortably below the
# lightest car axle in the shipped fleet (~620 kg) and comfortably above the noise floor
# (2e-4 mV/V, i.e. 1 kg).

name: default
description: Peak feature, static affine baseline. The floor every other configuration must beat.

preprocess:
  despike: false
  filter: none
  compensate_group_delay: true
  zero_window_s: 2.0
  zero_update_s: 0.25

detect:
  start_threshold: 0.05     # ~250 kg
  end_threshold: 0.02       # ~100 kg
  end_hold_s: 0.002
  min_duration_s: 0.001
  max_duration_s: 2.0
  refractory_s: 0.0         # axles within a bogie are milliseconds apart; never suppress them
  merge_gap_s: 0.6
  subsample_peak: true
  area_pad_widths: 1.0

estimate:
  feature: peak
  axle_summation: whole_signal
  estimator: static_affine
  coverage_target: 0.95
  bootstrap_passes: 50

uncertainty:
  # analytic is the estimator's own band; conformal reads the quantile off the residuals actually
  # seen and assumes nothing about their shape. The experiment sweeps this.
  method: analytic
  conformal_score: relative
  max_calibration: 500

drift:
  detectors: [cusum, page_hinkley]
  warmup: 200
  cusum_threshold: 12.0
  cusum_slack: 0.5           # nothing at or below this is ever detected -- the loop's hard floor
  page_hinkley_threshold: 15.0
  page_hinkley_tolerance: 0.5
  adwin_delta: 0.002
  ks_window: 60
  ks_alpha: 0.0001

control:
  # Off by default so phase 2's and phase 4's numbers stay comparable.
  enabled: false
  confirmation_passes: 30
  confirm_sigma: 3.0
  min_reference_observations: 10
  cooldown_s: 3600.0
  verification_passes: 50
  max_references: 200
  arbitration: local
  reference_mode: supervised
  reference_every_n: 20      # the supply rate of known masses; the most important swept factor
