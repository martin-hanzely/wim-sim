# CUSUM at twice the shipped threshold, for Stage E1.
#
# The threshold ladder only ever went DOWN from 12.0, and C2 found recall declining monotonically
# as it fell (3, 3, 2, 1 of 20 on S4). If sensitivity is not the binding constraint, the other
# direction has never been looked at, and a ladder with the best point at its own endpoint is a
# ladder that has not been bracketed.

extends: default
name: detect_cusum_h24
description: CUSUM alone, threshold 24.0 -- twice the shipped value, bracketing the ladder above.
drift:
  detectors: [cusum]
  cusum_threshold: 24.0
