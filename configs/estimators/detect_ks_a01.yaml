# ks at a looser confidence level: 100x the shipped 1e-4.
#
# This detector's knob runs the other way from CUSUM's and Page-Hinkley's: it is a significance
# level, so a LARGER value is more willing to declare a change. At the shipped setting this detector
# found nothing at all in 100 runs, on either scenario.
#
# The shipped operating point spends 0.00-0.06 false alarms an hour against a budget an operator
# would set far higher, so this arm spends some of it.

extends: default
name: detect_ks_a01
description: ks alone, 100x the shipped 1e-4.
drift:
  detectors: [ks]
  ks_alpha: 0.01
