# Non-blocking twin of `detect_ks_a1`, for Stage C1.
#
# Identical in every respect except `control.blocking`, so the pair differs in one thing: whether a
# drift alarm raised while the loop is confirming, recalibrating, verifying or degraded is
# published or swallowed. Detection recall is scored from exactly those events.

extends: detect_ks_a1
name: detect_ks_a1_nb
description: windowed KS alone at alpha 1e-1, with the controller's blocking behaviour disabled.
control:
  blocking: false
