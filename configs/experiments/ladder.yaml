# The phase-6 checkpoint: every estimator across every scenario.
#
# This is the sweep the buildspec asks for -- "a results table comparing all estimators across all
# scenarios" -- and it is the first time any number in this project has been produced by anything
# other than a hand-typed command.
#
# S8_replay_real is deliberately absent. It has no reference masses, so nothing here can score it;
# see docs/sim-to-real.md, and `wimsim validate-real-data`.
#
# Three seeds rather than one. A single seed gives a number with no error bar, and on a scenario
# whose faults interact with traffic that happened to arrive at a particular moment, a single run
# is an anecdote.

experiment_id: ladder
description: >
  Static, RLS and Kalman across the seven scorable scenarios, three seeds each, with the controller
  enabled and one reference vehicle in ten. The reference rate is deliberately realistic rather than
  generous: it is the rate that decides whether self-calibration is possible at a site at all.

scenarios:
  - S1_nominal
  - S2_thermal_cycle
  - S3_zero_drift_walk
  - S4_step_fault
  - S5_outage
  - S6_combined
  - S7_sparse_reference

estimators: [static_affine, rls, kalman]
seeds: [1, 2, 3]

edge_config: default
edge_overrides:
  - edge.control.enabled=true

# One reference in ten. Note what this costs the detectors: their warm-up is counted in residuals,
# so readiness takes warmup * reference_every_n passes -- see docs/controller.md.
reference_every_n: 10

# The scenarios ship at 6 to 72 hours, except S1 at 15 minutes. Left at their shipped lengths:
# shortening them would change what they are for, and S2's whole point is a 72-hour thermal cycle.
overrides:
  - scenario.output.samples=none

# S1 is the exception, and it has to be. At 900 s it produces 62 crossings, 60 of which go to the
# calibration window -- so the row was a mean over two passes, with a coverage of 0.5000 that meant
# one of them was covered. Six hours puts it in the same range as the rest of the sweep without
# changing what S1 *is*: it carries no drift, no faults and no dynamics at any length.
scenario_overrides:
  S1_nominal:
    - scenario.duration_s=21600.0

calibration_passes: 60

# An alarm within half an hour of an injected fault counts as having detected it. Generous, and
# deliberately so: the interesting failure is a fault that is never detected at all, not one
# detected in twenty-five minutes rather than twenty.
fault_horizon_s: 1800.0
