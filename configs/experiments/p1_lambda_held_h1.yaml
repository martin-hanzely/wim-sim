# Held-out check of a tuned memory: lambda 0.999, chosen on S2, applied to H1 (S2's class). Chosen before running.
experiment_id: p1_lambda_held_h1
description: >
  Held-out check of a tuned memory: lambda 0.999, chosen on S2, applied to H1 (S2's class). Chosen before running.
scenarios: [H1_warm_front]
