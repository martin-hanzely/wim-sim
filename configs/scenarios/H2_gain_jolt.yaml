  white_sigma: 1.0e-4
  pink_sigma: 1.8e-4
  pink_f_min_hz: 0.0005
  pink_f_max_hz: 20.0
  mains: {enabled: true, freq_hz: 50.0, amplitude: 9.4e-4, harmonics: [0.26, 0.15]}
