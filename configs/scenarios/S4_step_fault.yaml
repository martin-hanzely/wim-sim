# S4 -- abrupt sensitivity jump. The headline control scenario.
#
# Two distinct faults, deliberately different in character, so the detectors have to distinguish
# them rather than just fire:
#
#   t = 4 h   amplifier gain instability: k jumps by -4 % and stays there. Nothing else changes,
#             so the only evidence is a shift in the residual mean.
#   t = 9 h   mechanical displacement: k jumps by +2.5 % *and* the zero line steps by 0.02 mV/V.
#             A zero-only detector sees this one and misses the first; a gain-only detector does
#             the reverse.
#
# The scored quantity is time-to-reconverge: how long after each step the estimated gain returns to
# within tolerance of the true gain. That number, per estimator, is the paper's central table.

extends: _base_traffic
name: S4_step_fault
description: Abrupt sensitivity jumps from amplifier instability and sensor displacement.
station: endurance

duration_s: 57600.0         # 16 h
seed: 20250604
block_seconds: 60.0
plant_rate_hz: 50.0

traffic:
  rate_per_hour: 220.0
  dynamic_load: {enabled: true, amplitude: 0.06, freq_hz_mean: 2.0, freq_hz_std: 0.4}

temperature:
  mean_c: 16.0
  daily_amplitude_c: 5.0      # a mild cycle, so the step is not the only thing moving
  peak_hour_utc: 15.0
  trend_c_per_day: 0.0
  noise_sigma_c: 0.3
  noise_tau_s: 900.0

zero_drift:
  q0: 0.05
  random_walk_sigma_per_sqrt_s: 2.0e-5
  linear_slope_per_hour: 0.0
  steps: []
  step_rate_per_hour: 0.0
  temp_coupling_per_c: 8.0e-5

noise:
  white_sigma: 2.0e-4
  pink_sigma: 1.2e-4
  pink_f_min_hz: 0.0005
  pink_f_max_hz: 20.0
  mains: {enabled: false, freq_hz: 50.0, amplitude: 1.0e-4, harmonics: [0.3, 0.1]}

pulse:
  shape: emg
  emg_tau_ratio: 0.55
  support_widths: 8.0

faults:
  - type: gain_instability
    label: amp_gain_drop
    t_start_s: 14400.0        # 4 h
    duration_s: null          # permanent
    factor: 0.96
    ramp_s: 0.0

  - type: sensor_displacement
    label: pad_shift
    t_s: 32400.0              # 9 h
    k_factor: 1.025
    q_delta: 0.02

output:
  truth_rate_hz: 1.0
  samples: windows
  window_pad_s: 2.0
