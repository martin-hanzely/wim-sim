# S6 with the CALIBRATION FAULTS removed. One of four ablations; see
# configs/experiments/ablation.yaml.
#
# WHAT IS DISABLED, exactly: the ramped gain loss and the sensor displacement -- the two faults that
# actually make the scale wrong, and the only two S6 carries that `CALIBRATION_FAULTS` scores. The
# brief calls this component the sensitivity step; S6 injects it as a ramp and a step, and both are
# removed together because leaving one in would leave the mechanism being tested in place.
#
# NOTE FOR READING THE TABLE. This arm has no calibration fault, so detection recall in it is
# UNDEFINED rather than zero, and the reconvergence metric is unmeasurable. Only the accuracy
# comparison is interpretable here, which is the one the ablation is about.
extends: S6_combined
name: S6_ablate_calibration_fault
description: S6 with the ramped gain loss and the sensor displacement removed.
faults:
  - type: channel_dropout
    label: adc_stuck
    t_start_s: 64800.0
    duration_s: 90.0
    mode: stuck
    stuck_value: null
  - type: clock_skew
    label: ntp_slip
    t_start_s: 86400.0
    offset_s: 0.35
    drift_ppm: 45.0
  - type: connectivity_loss
    label: link_down
    t_start_s: 100800.0
    duration_s: 1800.0
  - type: heartbeat_loss
    label: heartbeat_gap
    t_start_s: 100800.0
    duration_s: 2100.0
