# The phase-3 stack: transport, storage, and the observability plane.
#
# Image tags are pinned. An artifact whose infrastructure drifts under it cannot be reproduced
# months later, and "it worked in March" is not a result (principle 3).
#
# Host ports are overridable through .env because they collide with whatever else a developer runs.
# TimescaleDB defaults to 5433, not 5432, because a local PostgreSQL on 5432 is the common case --
# and a silent connection to the *wrong* database is a far worse failure than a refused one.
#
#   docker compose up -d                       everything
#   docker compose --profile core up -d        just Mosquitto and TimescaleDB
#   make up / make down / make logs

name: wimsim

x-restart: &restart
  restart: unless-stopped

services:
  # -- transport -----------------------------------------------------------------------------
  mosquitto:
    <<: *restart
    image: eclipse-mosquitto:2.0.22
    profiles: [core, full]
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      # `mosquitto_sub -E` connects, subscribes, exits. A TCP check would pass on a broker that
      # accepted connections and rejected every subscription.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", '$$SYS/#', "-E", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # -- storage -------------------------------------------------------------------------------
  timescaledb:
    <<: *restart
    image: timescale/timescaledb:2.17.2-pg16
    profiles: [core, full]
    environment:
      POSTGRES_USER: ${PGUSER:-wimsim}
      POSTGRES_PASSWORD: ${PGPASSWORD:-wimsim}
      POSTGRES_DB: ${PGDATABASE:-wimsim}
      # Deterministic collation: index and ORDER BY behaviour must not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-wimsim} -d ${PGDATABASE:-wimsim}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -- observability plane -------------------------------------------------------------------
  otel-collector:
    <<: *restart
    image: otel/opentelemetry-collector-contrib:0.115.1
    profiles: [full]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8889}:8889"   # Prometheus scrapes this
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  prometheus:
    <<: *restart
    image: prom/prometheus:v3.0.1
    profiles: [full]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      # Tempo's metrics generator remote-writes span metrics here; without this it is refused.
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  loki:
    <<: *restart
    image: grafana/loki:3.3.2
    profiles: [full]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"

  tempo:
    <<: *restart
    image: grafana/tempo:2.6.1
    profiles: [full]
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./docker/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-3200}:3200"

  grafana:
    <<: *restart
    image: grafana/grafana:11.4.0
    profiles: [full]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      # Dashboards are provisioned from the repo and are read-only in the UI on purpose: a
      # dashboard edited in a browser and not committed is a result nobody else can reproduce.
      GF_INSTALL_PLUGINS: ""
      # Grafana's provisioning files interpolate $VAR but NOT bash-style ${VAR:-default}.
      # Compose resolves the defaults here so Grafana only ever sees a plain value; without
      # this the Timescale datasource provisions with an empty user and fails at query time.
      PGUSER: ${PGUSER:-wimsim}
      PGPASSWORD: ${PGPASSWORD:-wimsim}
      PGDATABASE: ${PGDATABASE:-wimsim}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - timescaledb

volumes:
  mosquitto_data:
  timescale_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
