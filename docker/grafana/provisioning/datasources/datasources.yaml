apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: wimsim-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: wimsim-tempo

  - name: Tempo
    type: tempo
    uid: wimsim-tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: wimsim-loki
        filterByTraceID: true
      tracesToMetrics:
        datasourceUid: wimsim-prometheus
      serviceMap:
        datasourceUid: wimsim-prometheus
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: wimsim-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: wimsim-tempo

  # Interpolated from the container environment. Grafana understands $VAR here; it does NOT
  # understand ${VAR:-default}, so compose resolves the defaults before they arrive.
  # The measurement events and the truth log both live here. This is the datasource the
  # calibration dashboard uses to draw estimate against truth on the same axes.
  - name: TimescaleDB
    type: postgres
    uid: wimsim-timescale
    access: proxy
    url: timescaledb:5432
    user: $PGUSER
    secureJsonData:
      password: $PGPASSWORD
    jsonData:
      database: $PGDATABASE
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
