# Development broker. Anonymous access is fine on a loopback-only dev stack and is NOT fine
# anywhere else; phase 3 is not a deployment.

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

# Persistence matters here. The publisher keeps its own on-disk queue so an outage cannot lose
# events, but QoS-1 delivery state lives in the broker: without this, restarting Mosquitto would
# silently drop in-flight messages and the outage test would pass for the wrong reason.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

max_queued_messages 100000
message_size_limit 1048576

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
