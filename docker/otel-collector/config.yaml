# The collector is the edge's only outbound observability dependency. Everything the station emits
# goes here over OTLP, and the collector fans it out. That matters for S5: a station whose link is
# down buffers locally and replays, and a pull-based scrape of the station could not work at all.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource:
    attributes:
      - key: stack
        value: wimsim
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep the edge's own resource attributes as labels; station_id is how every dashboard filters.
    resource_to_telemetry_conversion:
      enabled: true
    enable_open_metrics: true
    # Export the names the code declares, not the names the exporter would invent.
    #
    # By default this exporter appends the OTel unit to every metric name, so `wim_buffer_depth`
    # (unit "1") is scraped as `wim_buffer_depth_ratio`, `wim_cal_gain_estimate` (unit
    # "{sensor}/kg") as `wim_cal_gain_estimate_per_kg`, and `wim_publish_latency_ms` (unit "ms") as
    # `wim_publish_latency_ms_milliseconds`. Buildspec section 9 names these metrics, the registry
    # in observability/metrics.py declares exactly those names, and every dashboard panel queries
    # them literally -- so a rename here means every panel renders empty and says nothing about
    # why. Turning the suffixes off is what makes those three agree.
    #
    # It also disables the automatic `_total` on counters, which costs nothing: the registry
    # already names counters `..._total` itself, and tests/test_metrics.py enforces that they are
    # the only metrics that do.
    add_metric_suffixes: false

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
