[project]
name = "wimsim"
version = "0.1.0"
description = "Observable Weigh-in-Motion measurement-chain simulator and self-calibration testbed"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    # phase 3: transport and storage
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
wimsim = "wimsim.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:wimsim.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Correctness, imports, modern syntax, common bug patterns. Deliberately not "ALL": opinion-only
# rules produce noise that trains people to ignore the linter.
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "RUF"]
# `ruff format` is the authority on code width. E501 is off because the remaining long lines are
# prose in docstrings and single-token strings -- inline JSON config overrides in tests, format
# strings -- that only get harder to read when split.
ignore = ["E501", "RUF046"]

[tool.ruff.lint.per-file-ignores]
# The negative-control test asserts that pytest.fail fires, and Failed derives from BaseException.
"tests/test_truth_isolation.py" = ["B017"]
"tests/test_architecture.py" = ["B017"]
